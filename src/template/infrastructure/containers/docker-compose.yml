services:
  webapi-service:
    image: genocs/webapi-service:${IMAGE_VERSION}
    hostname: webapi-service
    container_name: webapi-service
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - consul__url=${CONSUL_URL}
      - consul__address=webapi
      - consul__port=8080
      - fabio__url=${FABIO_URL}
      - logger__seq__enabled=true
      - logger__seq__url=${SEQ_URL}
      - logger__seq__apiKey=${SEQ_APIKEY}
      - logger__httpPayload__enabled=true
      - logger__httpPayload__captureRequestBody=true
      - telemetry__exporter__enabled=true
      - telemetry__exporter__otlpEndpoint=${OTLP_URL}
      - mongodb__connectionString=${MONGO_DB_CONNECTION_STRING}
      - rabbitmq__hostname=rabbitmq

    ports:
      - 5500:8080
    networks:
      - genocs
    # network_mode: bridge
    volumes:
      - webapi-service:/root/.aspnet/DataProtection-Keys

  worker-service:
    image: genocs/worker-service:${IMAGE_VERSION}
    hostname: worker-service
    container_name: worker-service
    environment:
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - logger__seq__enabled=true
      - logger__seq__url=${SEQ_URL}
      - logger__seq__apiKey=${SEQ_APIKEY}
      - logger__httpPayload__enabled=true
      - logger__httpPayload__captureRequestBody=true
      - telemetry__exporter__enabled=true
      - telemetry__exporter__otlpEndpoint=${OTLP_URL}
      - mongodb__connectionString=${MONGO_DB_CONNECTION_STRING}
      - rabbitmq__hostname=rabbitmq
    networks:
      - genocs

networks:
  genocs:
    name: genocs-network
    external: true
    driver: bridge

volumes:
  webapi-service:
    driver: local
